
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الجميلة</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #00e5ff;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        button {
            background: #00e5ff;
            color: #141e30;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: white;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>أهلاً وسهلاً بك! 👋</h1>

        <p>
            مرحباً بك في موقعي الأول.
            هذه صفحة بسيطة صممتها باستخدام HTML وCSS.
        </p>

        <button onclick="alert('أهلاً بك في موقعي! 🎉')">
            اضغط هنا
        </button>
    </div>

</body>
</html>
